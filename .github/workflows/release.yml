name: Release

on:
  push:
    tags:
      - 'release-v*' # 发布 tag 使用 release-v<版本号>，例如 release-v1.10.0
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 release-v1.10.0）'
        required: true
        type: string

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  resolve-version:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="$INPUT_TAG"
          fi
          VERSION=$(echo "$TAG" | sed -E 's/^release-v?//; s/^v//')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无法从 tag 解析三段版本号：$TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析得到 tag=$TAG version=$VERSION"

  test:
    name: Run tests (gate)
    runs-on: ubuntu-latest
    needs: resolve-version

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate JSON serializable code
        run: dart run build_runner build

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        # analyze 失败同样阻塞 release，与 ci.yml gate 对齐

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [resolve-version, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release app
        run: flutter build windows --release --build-name=${{ needs.resolve-version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem -Path @(
            "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe",
            "$env:ProgramFiles/Inno Setup*/ISCC.exe"
          ) -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $compiler) {
            throw 'Inno Setup compiler not found under Program Files'
          }
          & $compiler.FullName "/DAppVersion=${{ needs.resolve-version.outputs.version }}" 'windows/installer/LinkUp.iss'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: linkup-windows-installer
          path: build/windows/installer/LinkUp-Setup-${{ needs.resolve-version.outputs.version }}.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK and publish Release
    runs-on: ubuntu-latest
    needs: [resolve-version, test, build-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
          fetch-depth: 0 # 拿全 history 以便生成 changelog

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate JSON serializable code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 跳过 flutter test — ci.yml 已经在 push/PR 上跑过同一命令作为 gate；
      # release 流程不应该重复运行，避免浪费 wall-clock

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.resolve-version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK to linkup.apk
        id: artifact
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          DST=linkup.apk
          cp "$SRC" "$DST"
          SIZE=$(du -h "$DST" | cut -f1)
          echo "apk_path=$DST" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # 拿到上一个 release-v* tag 与当前 tag 之间的 commits
          CURRENT="${{ needs.resolve-version.outputs.tag }}"
          PREV=$(git tag --sort=-creatordate | grep -E '^release-v' | grep -v -x -F "$CURRENT" | head -1 || echo "")
          {
            echo "## 📦 LinkUp ${{ needs.resolve-version.outputs.version }}"
            echo ""
            echo "### 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              git log "$PREV..$CURRENT" --pretty=format:'- %s (%h)' --no-merges
            else
              git log "$CURRENT" --pretty=format:'- %s (%h)' --no-merges -20
            fi
            echo ""
            echo ""
            echo "### 安装"
            echo ""
            echo "- Android: 下载下方 \`linkup.apk\` 直接安装（APK 大小约 ${{ steps.artifact.outputs.apk_size }}）"
            echo "- Android 安装后请在系统设置中授予「自启动」和「忽略电池优化」权限以保证后台保活"
            echo "- Windows: 下载下方 \`LinkUp-Setup-${{ needs.resolve-version.outputs.version }}.exe\` 并运行安装器完成升级"
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```'
            sha256sum "${{ steps.artifact.outputs.apk_path }}"
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: linkup-windows-installer
          path: windows-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: LinkUp ${{ needs.resolve-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            windows-artifact/LinkUp-Setup-${{ needs.resolve-version.outputs.version }}.exe
