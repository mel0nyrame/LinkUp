name: Release

on:
  push:
    tags:
      - 'release-v*' # 发布 tag 使用 release-v<版本号>，例如 release-v1.10.0
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 release-v1.10.0）'
        required: true
        type: string

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  resolve-version:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="$INPUT_TAG"
          fi
          if ! [[ "$TAG" =~ ^release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "发布 tag 必须采用 release-v<主版本.次版本.修订号>：$TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析得到 tag=$TAG version=$VERSION"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Verify manually written release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "缺少发布说明：${NOTES_FILE}。请先在目标提交中编写中文发布说明，再创建 tag。" >&2
            exit 1
          fi
          if ! awk '
            /^## 更新内容$/ { in_updates = 1; next }
            /^## / { in_updates = 0 }
            in_updates && /^- .+/ { found = 1 }
            END { exit !found }
          ' "$NOTES_FILE"; then
            echo "发布说明须包含「## 更新内容」和至少一条具体更新。" >&2
            exit 1
          fi

  test:
    name: Run tests (gate)
    runs-on: ubuntu-latest
    needs: resolve-version

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate JSON serializable code
        run: dart run build_runner build

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        # analyze 失败同样阻塞 release，与 ci.yml gate 对齐

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [resolve-version, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release app
        run: flutter build windows --release --build-name=${{ needs.resolve-version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem -Path @(
            "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe",
            "$env:ProgramFiles/Inno Setup*/ISCC.exe"
          ) -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $compiler) {
            throw 'Inno Setup compiler not found under Program Files'
          }
          & $compiler.FullName "/DAppVersion=${{ needs.resolve-version.outputs.version }}" 'windows/installer/LinkUp.iss'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: linkup-windows-installer
          path: build/windows/installer/LinkUp-Setup-${{ needs.resolve-version.outputs.version }}.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK and publish Release
    runs-on: ubuntu-latest
    needs: [resolve-version, test, build-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate JSON serializable code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 跳过 flutter test — ci.yml 已经在 push/PR 上跑过同一命令作为 gate；
      # release 流程不应该重复运行，避免浪费 wall-clock

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.resolve-version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK to linkup.apk
        id: artifact
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          DST=linkup.apk
          cp "$SRC" "$DST"
          echo "apk_path=$DST" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: linkup-windows-installer
          path: windows-artifact

      - name: Compose Chinese release notes
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
        run: |
          WINDOWS_FILE="LinkUp-Setup-${VERSION}.exe"
          {
            cat "docs/releases/${RELEASE_TAG}.md"
            printf '\n## 下载与安装\n\n'
            printf -- '- 安卓：下载下方的 `%s` 并安装；需要离开界面后持续监控时，在应用中开启「保留后台运行」。\n' "$APK_PATH"
            printf -- '- Windows：下载下方的 `%s` 并运行安装器。\n' "$WINDOWS_FILE"
            printf '\n## 文件校验\n\n以下为发布文件的 SHA-256 校验值：\n\n```text\n'
            sha256sum "$APK_PATH"
            (cd windows-artifact && sha256sum "$WINDOWS_FILE")
            printf '```\n'
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: LinkUp ${{ needs.resolve-version.outputs.version }} · 正式版
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            windows-artifact/LinkUp-Setup-${{ needs.resolve-version.outputs.version }}.exe
