name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & Test (Dart)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要 base SHA 才能算出本次改动触及了哪些文件。
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate JSON serializable code
        run: dart run build_runner build

      - name: Detect changed areas
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(pubspec\.yaml|pubspec\.lock)$'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(android/|pubspec\.yaml$|pubspec\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      # 一次全仓格式化之后，格式就是 CI 的永久门：新引入的排版漂移在 PR 上翻红，
      # 不再靠"谁碰到那个文件谁负责"。（此前只判定本次触及的文件。）
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      # 依赖集变化会让生成的 plugin registrant 漂移。历史上 flutter_secure_storage
      # 就是这样漏掉的：依赖引入了，registrant 没重新生成，也没有任何检查发现。
      - name: Verify generated plugin registrants are current
        if: steps.changes.outputs.deps == 'true'
        run: |
          flutter pub get
          git diff --exit-code -- \
            '*generated_plugin_registrant*' \
            '**/generated_plugins.cmake' \
            '**/GeneratedPluginRegistrant.*'

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
