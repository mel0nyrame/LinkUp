<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LinkUp Android showcase composition</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #fff; color: #14253f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .showcase { position: relative; width: 1200px; height: 790px; overflow: hidden; border-radius: 30px; background: linear-gradient(124deg, #f4f8ff, #e7f1ff 55%, #dcecfb); }
    .showcase::before { content: ""; position: absolute; right: -128px; top: -250px; width: 740px; height: 740px; border: 2px solid #c0dbf7; border-radius: 50%; box-shadow: 0 0 0 72px rgba(196,222,248,.31), 0 0 0 146px rgba(196,222,248,.22); }
    .showcase-copy { position: absolute; top: 90px; left: 66px; width: 370px; }
    .eyebrow { color: #2478bd; font-size: 19px; font-weight: 800; letter-spacing: .14em; }
    .showcase h2 { margin: 24px 0 22px; font-size: 56px; line-height: 1.24; letter-spacing: -.04em; color: #102b50; }
    .showcase p { margin: 0 0 20px; color: #456380; font-size: 25px; line-height: 1.55; }
    .showcase-note { margin-top: 48px; padding: 17px 19px; border-left: 5px solid #ef665f; background: rgba(255,255,255,.72); color: #365470; font-size: 20px; line-height: 1.45; border-radius: 0 12px 12px 0; }
    .phone { position: absolute; width: 330px; padding: 10px; background: #fff; border-radius: 38px; box-shadow: 0 24px 58px rgba(37,85,145,.20), 0 3px 8px rgba(37,85,145,.08); }
    .phone img { display: block; width: 100%; height: auto; border-radius: 29px; }
    .phone-overview { left: 478px; top: 112px; transform: rotate(-4deg); }
    .phone-settings { left: 834px; top: 43px; transform: rotate(4deg); }
    .phone-label { position: absolute; z-index: 3; padding: 11px 18px; border-radius: 100px; background: #fff; box-shadow: 0 8px 24px rgba(37,85,145,.14); color: #1768ae; font-size: 20px; font-weight: 760; }
    .label-overview { left: 474px; top: 44px; }
    .label-settings { left: 958px; top: 716px; }
  </style>
</head>
<body>
  <section class="showcase" aria-label="Android 客户端真实界面，概况页与网络配置页">
    <div class="showcase-copy">
      <div class="eyebrow">REAL ANDROID SCREENS</div>
      <h2>从连接状态，<br>到网络配置。</h2>
      <p>概况页查看当前状态与网络信息；设置页自动探测 ACID，也允许按学校网络环境手动配置。</p>
      <div class="showcase-note">真实截图 · 左侧概况页处于未连接状态</div>
    </div>
    <span class="phone-label label-overview">01 · 概况</span>
    <div class="phone phone-overview"><img src="../../main_screen.jpg" alt="Android 概况页"></div>
    <div class="phone phone-settings"><img src="../../setting_screen_2.jpg" alt="Android 网络配置页"></div>
    <span class="phone-label label-settings">02 · 网络配置</span>
  </section>
</body>
</html>
