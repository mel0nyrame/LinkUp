<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">LinkUp — 深澜校园网自动认证</title>
  <desc id="desc">Android 与 Windows 客户端。连接校园 Wi-Fi 后检查在线状态、完成深澜认证；离线时重新尝试。</desc>

  <rect width="1200" height="390" rx="28" fill="#F4F8FF"/>
  <path d="M0 1H1200M0 389H1200" stroke="#DCE8F5" stroke-width="2"/>

  <g id="brand" transform="translate(62 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g id="mark" fill="none" stroke-linecap="round" stroke-width="11">
      <path d="M4 21Q34 -7 64 21" stroke="#10C9EB"/>
      <path d="M19 39Q34 25 49 39" stroke="#328BFA"/>
      <circle cx="34" cy="55" r="5.5" fill="#5B5AF7" stroke="none"/>
    </g>
    <text x="88" y="54" font-size="62" font-weight="770" letter-spacing="-2.5" fill="#122746">LinkUp</text>
    <text x="0" y="145" font-size="37" font-weight="700" fill="#122746">校园网认证，交给 LinkUp。</text>
    <text x="0" y="191" font-size="23" fill="#425A77">连接 Wi-Fi 后自动认证，断线时检查并重连。</text>
    <g font-size="19" font-weight="650">
      <rect x="0" y="228" width="117" height="40" rx="20" fill="#E5F0FF"/>
      <text x="18" y="255" fill="#195FBE">Android</text>
      <rect x="129" y="228" width="129" height="40" rx="20" fill="#E5F0FF"/>
      <text x="147" y="255" fill="#195FBE">Windows</text>
    </g>
  </g>

  <g id="authentication-path" transform="translate(732 38)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="4" y="28" font-size="18" font-weight="700" letter-spacing="1" fill="#507293">连接后的自动流程</text>
    <path d="M25 80V266" fill="none" stroke="#B7D8F8" stroke-width="4"/>
    <circle cx="25" cy="91" r="11" fill="#1BBBE8" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="25" cy="175" r="11" fill="#3187F4" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="25" cy="259" r="11" fill="#3C74E8" stroke="#FFFFFF" stroke-width="4"/>
    <g font-size="24" font-weight="700" fill="#193B62">
      <text x="58" y="99">连接校园 Wi-Fi</text>
      <text x="58" y="183">检查并完成深澜认证</text>
      <text x="58" y="267">确认在线 · 持续监控</text>
    </g>
    <g font-size="18" fill="#5C7590">
      <text x="58" y="125">检测网络与当前状态</text>
      <text x="58" y="209">按需探测 ACID</text>
      <text x="58" y="293">掉线后重新尝试</text>
    </g>
  </g>
</svg>
